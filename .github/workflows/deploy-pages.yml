name: Deploy to GitHub Pages

# Publishes the static prototype (repo root) to GitHub Pages, then proves the
# deployed project-subpath build with a focused mobile smoke test.
# All asset paths are relative, so the app serves correctly from the project
# subpath (https://<user>.github.io/Motocross-Life-Simulator/).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  deployed-browser-smoke:
    name: Deployed browser smoke
    needs: deploy
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for deployed site
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location "$E2E_BASE_URL" > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages did not become reachable: $E2E_BASE_URL" >&2
          exit 1

      - name: Run deployed mobile/browser proof
        run: npx playwright test e2e/pages-smoke.spec.mjs
